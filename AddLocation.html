<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Location - eGn Study Room</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
      color: #555;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #28a745;
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      font-size: 14px;
    }
    .btn-submit {
      width: 100%;
      background-color: #28a745;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    .btn-gps {
      width: 100%;
      background-color: #e8f5e9;
      color: #28a745;
      border: 1.5px solid #28a745;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Add / Update Location</h2>

    <div class="form-group">
      <label>Select Property</label>
      <select>
        <option>Green Valley Hostel</option>
        <option>eGn PG House</option>
      </select>
    </div>

    <button class="btn-gps" onclick="alert('Current GPS location fetched!')">📍 Fetch Current GPS Location</button>

    <div class="form-group">
      <label>City / Town</label>
      <input type="text" placeholder="e.g., Patna">
    </div>

    <div class="form-group">
      <label>Area / Landmark</label>
      <input type="text" placeholder="e.g., Near Boring Road Chauraha">
    </div>

    <div class="form-group">
      <label>Pincode</label>
      <input type="number" placeholder="e.g., 800001">
    </div>

    <button class="btn-submit" onclick="alert('Location Updated Successfully!'); location.href='Dashboard.html'">Save Location</button>
  </div>

</body>
</html>
