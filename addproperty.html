<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Property - eGn Study Room</title>
  <style>
    body { margin: 0; padding: 20px; font-family: Arial, sans-serif; background-color: #f8f9fa; }
    .container { max-width: 400px; margin: 0 auto; }
    h2 { color: #333; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 14px; margin-bottom: 5px; color: #555; }
    input, select, textarea {
      width: 100%; padding: 12px; border: 1.5px solid #ddd; border-radius: 8px; box-sizing: border-box;
    }
    .btn-submit {
      width: 100%; background-color: #28a745; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Add New Property</h2>
    
    <div class="form-group">
      <label>Property Name</label>
      <input type="text" placeholder="e.g., Green Valley Hostel">
    </div>

    <div class="form-group">
      <label>Property Type</label>
      <select>
        <option>Hostel</option>
        <option>PG</option>
        <option>Room</option>
      </select>
    </div>

    <div class="form-group">
      <label>Monthly Rent (₹)</label>
      <input type="number" placeholder="e.g., 5000">
    </div>

    <div class="form-group">
      <label>Address</label>
      <textarea rows="3" placeholder="Enter full address"></textarea>
    </div>

    <button class="btn-submit" onclick="alert('Property Added Successfully!'); location.href='dashboard.html'">Submit Property</button>
  </div>

</body>
    </html>
