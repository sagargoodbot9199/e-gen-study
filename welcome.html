<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - eGn Study Room</title>
  <style>
    body { margin: 0; padding: 20px; font-family: Arial, sans-serif; background-color: #ffffff; text-align: center; }
    .container { max-width: 400px; margin: 0 auto; padding-top: 40px; }
    .logo { width: 70px; height: 70px; background-color: #28a745; border-radius: 15px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; font-weight: bold; }
    h2 { color: #333; margin-bottom: 5px; }
    p.subtitle { color: #6c757d; font-size: 14px; margin-bottom: 30px; }
    .card { border: 1.5px solid #28a745; border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; cursor: pointer; background-color: #f8fff9; text-align: left; }
    .card.secondary { border-color: #e0e0e0; background-color: #fff; }
    .icon { font-size: 24px; margin-right: 15px; }
    .card-text h4 { margin: 0; color: #333; font-size: 16px; }
    .card-text p { margin: 3px 0 0; color: #6c757d; font-size: 12px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">eGn</div>
    <h2>Welcome to</h2>
    <h2>eGn Study Room</h2>
    <p class="subtitle">Choose your role</p>

    <!-- Student Rolle -->
    <div class="card" onclick="selectRole('student')">
      <div class="icon">🎓</div>
      <div class="card-text">
        <h4>I am Student</h4>
        <p>Find rooms and hostels easily</p>
      </div>
    </div>

    <!-- Owner Role -->
    <div class="card secondary" onclick="selectRole('owner')">
      <div class="icon">🏠</div>
      <div class="card-text">
        <h4>I am Property Owner</h4>
        <p>List and manage your properties</p>
      </div>
    </div>

    <!-- Manager Role -->
    <div class="card secondary" onclick="selectRole('manager')">
      <div class="icon">👔</div>
      <div class="card-text">
        <h4>I am Property Manager</h4>
        <p>Manage tenant requests and rooms</p>
      </div>
    </div>
  </div>

<script>
  function selectRole(role) {
    sessionStorage.setItem('userRole', role);
    window.location.href = 'login.html';
  }
</script>

</body>
</html>
