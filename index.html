<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>eGn Study Room</title>
 <style>
 body {
 margin: 0;
 padding: 0;
 font-family: Arial, sans-serif;
 background-color: #ffffff;
 display: flex;
 justify-content: center;
 align-items: center;
 height: 100vh;
 }
 .splash-screen {
 text-align: center;
 display: flex;
 flex-direction: column;
 align-items: center;
 }
 .logo-container {
 background-color: #28a745;
 padding: 20px;
 border-radius: 20px;
 margin-bottom: 25px;
 width: 120px;
 height: 120px;
 display: flex;
 flex-direction: column;
 justify-content: center;
 align-items: center;
 color: white;
 }
 .logo-container h1 {
 margin: 0;
 font-size: 40px;
 font-weight: bold;
 }
 .icon-box {
 width: 60px;
 height: 50px;
 position: relative;
 border: 4px solid white;
 box-sizing: border-box;
 margin-top: 10px;
 }
 .icon-box::before {
 content: '';
 position: absolute;
 top: -20px;
 left: -4px;
 right: -4px;
 height: 20px;
 background: white;
 clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
 }
 h2 {
 color: #28a745;
 font-size: 30px;
 font-weight: bold;
 margin: 10px 0;
 }
 p {
 color: #6c757d;
 font-size: 16px;
 margin: 10px 0;
 line-height: 1.4;
 }
 .spinner {
 border: 4px solid rgba(40, 167, 69, 0.2);
 width: 40px;
 height: 40px;
 border-radius: 50%;
 border-left-color: #28a745;
 animation: spin 1s linear infinite;
 margin-top: 30px;
 }
 @keyframes spin {
 0% { transform: rotate(0deg); }
 100% { transform: rotate(360deg); }
 }
 </style>
</head>
<body>
 <div class="splash-screen">
 <div class="logo-container">
 <div class="icon-box"></div>
 <h1>eGn</h1>
 </div>
 <h2>eGn Study Room</h2>
 <p>Find the Right Room<br>for Your Dreams</p>
 <div class="spinner"></div>
 </div>
<script>
 setTimeout(function() {
 window.location.href = "welcome.html";
 }, 3000); // 3 सेकंड बाद ऑटोमेटिक दूसरी स्क्रीन खुल जाएगी
</script>
 <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCppaJUCRpdu6RLjrRMM3J_rWBvJH8ylk4",
    authDomain: "egn-study-room.firebaseapp.com",
    projectId: "egn-study-room",
    storageBucket: "egn-study-room.firebasestorage.app",
    messagingSenderId: "1002377857718",
    appId: "1:1002377857718:web:f15a9ebb5ba8e8e1eff417"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // यदि यूज़र लॉगिन नहीं है तो उसे वापस लॉगिन पेज पर भेजेगा
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "login.html";
    }
  });
</script>
</body>
</html>
