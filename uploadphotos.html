<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Photos - eGn Study Room</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; text-align: center; background: #f9f9f9; }
    .upload-box { border: 2px dashed #28a745; padding: 20px; border-radius: 10px; background: #fff; margin-bottom: 15px; }
    .btn { background: #28a745; color: white; padding: 12px 20px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; }
    #preview-container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 15px; }
    .preview-img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; border: 1px solid #ccc; }
    #status { margin-top: 15px; font-weight: bold; color: #28a745; }
  </style>
</head>
<body>

  <h2>कमरे की फोटो अपलोड करें</h2>

  <div class="upload-box">
    <!-- capture="environment" से सीधे मोबाइल का कैमरा खुलेगा -->
    <input type="file" id="photoInput" accept="image/*" capture="environment" multiple style="display: none;">
    
    <button class="btn" onclick="document.getElementById('photoInput').click()">📸 कैमरा खोलें / फोटो चुनें</button>
  </div>

  <!-- खींचते ही फोटो यहाँ तुरंत दिखेगी -->
  <div id="preview-container"></div>

  <button class="btn" id="uploadBtn" style="background-color: #007bff;">Firebase में फोटो सेव करें</button>

  <div id="status"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCppaJUCRpdu6RLjrRMM3J_rWBvJH8ylk4",
      authDomain: "egn-study-room.firebaseapp.com",
      projectId: "egn-study-room",
      storageBucket: "egn-study-room.firebasestorage.app",
      messagingSenderId: "1002377857718",
      appId: "1:1002377857718:web:f15a9ebb5ba8e8e1eff417"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);

    const photoInput = document.getElementById('photoInput');
    const previewContainer = document.getElementById('preview-container');
    const status = document.getElementById('status');
    let selectedFiles = [];

    // 1. फोटो खींचने/चुनने पर तुरंत प्रिव्यू (Preview) दिखाना
    photoInput.addEventListener('change', (e) => {
      selectedFiles = Array.from(e.target.files);
      previewContainer.innerHTML = '';

      selectedFiles.forEach(file => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        img.classList.add('preview-img');
        previewContainer.appendChild(img);
      });
      status.innerText = `${selectedFiles.length} फोटो चुनी गई!`;
    });

    // 2. Firebase Storage में असली फोटो अपलोड करना
    document.getElementById('uploadBtn').addEventListener('click', async () => {
      if (selectedFiles.length === 0) {
        alert('कृपया पहले कोई फोटो खींचें या चुनें!');
        return;
      }

      status.innerText = 'फोटो अपलोड हो रही है, कृपया प्रतीक्षा करें...';

      try {
        const uploadedUrls = [];
        for (const file of selectedFiles) {
          const storageRef = ref(storage, 'room_photos/' + Date.now() + '_' + file.name);
          await uploadBytes(storageRef, file);
          const downloadURL = await getDownloadURL(storageRef);
          uploadedUrls.push(downloadURL);
        }

        // फोटो का लिंक लोकल मेमोरी में सेव कर लें
        sessionStorage.setItem('roomPhotos', JSON.stringify(uploadedUrls));

        status.innerText = '✅ फोटो सफलतापूर्वक Firebase में सेव हो गई!';
        
        // सफलता के बाद रूम डिटेल्स वाले पेज पर भेजें
        setTimeout(() => {
          window.location.href = 'roomdetails.html';
        }, 1500);

      } catch (error) {
        console.error("Upload Error:", error);
        status.innerText = '❌ अपलोड फेल हुआ: ' + error.message;
      }
    });
  </script>

</body>
</html>
