<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Photos - eGn Study Room</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; text-align: center; background: #f9f9f9; }
    .upload-box { border: 2px dashed #28a745; padding: 20px; border-radius: 10px; background: #fff; margin-bottom: 15px; }
    .btn { background: #28a745; color: white; padding: 12px 20px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; }
    #preview-container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 15px; }
    .preview-img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; border: 1px solid #ccc; }
    #status { margin-top: 15px; font-weight: bold; color: #28a745; }
  </style>
</head>
<body>

  <h2>कमरे की फोटो अपलोड करें</h2>

  <div class="upload-box">
    <!-- capture="environment" से सीधे कैमरा खुलेगा -->
    <input type="file" id="photoInput" accept="image/*" capture="environment" multiple style="display: none;">
    <button class="btn" onclick="document.getElementById('photoInput').click()">📸 कैमरा खोलें / फोटो चुनें</button>
  </div>

  <!-- फोटो खींचते ही यहाँ दिखेगी -->
  <div id="preview-container"></div>

  <button class="btn" id="uploadBtn" style="background-color: #007bff;">फोटो सेव करें</button>

  <div id="status"></div>

  <script>
    const photoInput = document.getElementById('photoInput');
    const previewContainer = document.getElementById('preview-container');
    const status = document.getElementById('status');
    let selectedFiles = [];

    // 1. कैमरा/गैलरी से फोटो चुनते ही स्क्रीन पर तुरंत दिखाना
    photoInput.addEventListener('change', (e) => {
      selectedFiles = Array.from(e.target.files);
      previewContainer.innerHTML = '';

      selectedFiles.forEach(file => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        img.classList.add('preview-img');
        previewContainer.appendChild(img);
      });
      status.innerText = `${selectedFiles.length} फोटो चुनी गई!`;
    });

    // 2. फ्री सर्वर (ImgBB) पर फोटो सुरक्षित अपलोड करना
    document.getElementById('uploadBtn').addEventListener('click', async () => {
      if (selectedFiles.length === 0) {
        alert('कृपया पहले कोई फोटो खींचें या चुनें!');
        return;
      }

      status.innerText = 'फोटो अपलोड हो रही है, कृपया प्रतीक्षा करें...';
      const apiKey = 'd8bc610be4c8bd3ffae542ba2cbf8f54'; // Free API Key
      const uploadedUrls = [];

      try {
        for (const file of selectedFiles) {
          const formData = new FormData();
          formData.append('image', file);

          const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
            method: 'POST',
            body: formData
          });

          const result = await response.json();
          if (result.success) {
            uploadedUrls.push(result.data.url);
          }
        }

        // फोटो का URL मेमोरी में सेव हो गया
        sessionStorage.setItem('roomPhotos', JSON.stringify(uploadedUrls));
        status.innerText = '✅ फोटो सफलता से अपलोड और सेव हो गई!';

        setTimeout(() => {
          window.location.href = 'roomdetails.html';
        }, 1500);

      } catch (error) {
        console.error("Upload Error:", error);
        status.innerText = '❌ अपलोड फेल हुआ, पुनः प्रयास करें.';
      }
    });
  </script>

</body>
</html>
