<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Room - eGn Study Room</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
      color: #555;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #28a745;
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      font-size: 14px;
    }
    .btn-submit {
      width: 100%;
      background-color: #28a745;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Add New Room</h2>

    <div class="form-group">
      <label>Select Property</label>
      <select>
        <option>Green Valley Hostel</option>
        <option>eGn PG House</option>
      </select>
    </div>

    <div class="form-group">
      <label>Room Number / Name</label>
      <input type="text" placeholder="e.g., Room 101">
    </div>

    <div class="form-group">
      <label>Room Type</label>
      <select>
        <option>Single Bed</option>
        <option>Double Bed (Sharing)</option>
        <option>Triple Bed (Sharing)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Monthly Rent Per Person (₹)</label>
      <input type="number" placeholder="e.g., 3500">
    </div>

    <!-- फॉर्म सबमिट होने पर वापस dashboard.html पर ले जाएगा -->
    <button class="btn-submit" onclick="alert('Room Added Successfully!'); location.href='dashboard.html'">Save Room</button>
  </div>

</body>
</html>
